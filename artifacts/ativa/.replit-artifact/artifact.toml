kind = "web"
previewPath = "/"
title = "ATIVA — Projeto sobre estudantes indígenas"
version = "1.0.0"
id = "artifacts/ativa"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20948

[services.development]
run = "pnpm --filter @workspace/ativa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ativa", "run", "build" ]
publicDir = "artifacts/ativa/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20948"
BASE_PATH = "/"
